name: router
type: router
description: Smart Orchestrator router agent with intelligent LLM selection

llm_routing: true
session_memory: true
user_context: true
intelligent_model_selection: true
fallback_agent: llm_fast
confidence_threshold: 0.55

routes:
  - match: "weather"
    agent: weather
  - match: "forecast"
    agent: weather
  - match: "temperature"
    agent: weather
  - match: "schedule"
    agent: scheduler
  - match: "remind"
    agent: scheduler

# Intelligent LLM routing based on task complexity and CPU resources
llm_routes:
  # Ultra-trivial queries -> TinyLlama (highest performance)
  # Cost: <1s response, minimal memory impact
  - patterns: ["hi ", "hello", "good morning", "what time", "current time", "today", "weather", "temperature"]
    agent: llm_ultra_light
  
  # Simple factual queries -> Phi-3 Mini (good balance of speed and capability)
  # Cost: 1-3s response, low memory impact
  - patterns: ["what is", "who is", "when is", "where is", "definition", "name", "list", "explain briefly", "explain", "why", "analyze", "compare", "code", "write", "design", "implement", "debug", "refactor"]
    agent: llm_phi_fast

# Fallback hierarchy for unavailable models
fallback_hierarchy:
  - llm_phi_fast    # If primary fails, try Phi-3 Mini
  - llm_ultra_light # Then TinyLlama

response_template: "Router selected agent '{{ selected_agent }}' for message '{{ message }}'."
