name: router
type: router
description: Smart Orchestrator router agent

llm_routing: true
session_memory: true
user_context: true
model: gpt-4o-mini
fallback_agent: llm
confidence_threshold: 0.55

routes:
  - match: "weather"
    agent: weather
  - match: "forecast"
    agent: weather
  - match: "temperature"
    agent: weather
  - match: "echo"
    agent: echo

# NEW: required for Home Assistant
response_template: "Router selected agent '{{ selected_agent }}' for message '{{ message }}'."
