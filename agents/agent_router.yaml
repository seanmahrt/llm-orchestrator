name: router
type: router
description: Smart router that selects the correct agent based on intent, user context, and session history.

# Enable LLM-based routing
llm_routing: true

# Model used for routing decisions
model: gpt-4o-mini

# Enable session-aware routing
session_memory: true

# Enable user-aware routing
user_context: true

# Fallback agent if routing confidence is low
fallback_agent: llm

# Confidence threshold for LLM routing
confidence_threshold: 0.55

# Static routing hints (fast-path rules)
routes:
  - match: "weather"
    agent: weather
  - match: "forecast"
    agent: weather
  - match: "temperature"
    agent: weather
  - match: "echo"
    agent: echo
